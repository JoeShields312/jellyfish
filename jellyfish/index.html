<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A real-time WebGL2 jellyfish simulation: raymarched volumetric bells, verlet tentacle physics, and a bioluminescent post-processing chain.">
<meta name="theme-color" content="#000106">
<meta property="og:title" content="Medusa — Volumetric Jellyfish">
<meta property="og:description" content="A real-time WebGL2 jellyfish simulation: raymarched volumetric bells, verlet tentacle physics, and a bioluminescent post-processing chain.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2742%27 r=%2732%27 fill=%27%234aa3ff%27/%3E%3C/svg%3E">
<title>Medusa — Volumetric Jellyfish</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000106;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
  #panel{position:absolute;bottom:0;right:0;z-index:30;margin:16px;
    background:rgba(3,10,26,.5);backdrop-filter:blur(8px);
    border:1px solid rgba(100,170,255,.12);border-radius:4px;
    color:rgba(140,190,235,.65);font-size:10px;letter-spacing:.08em;width:212px;
    display:flex;flex-direction:column;max-height:calc(100vh - 32px);transition:width .22s ease;}
  #panelHead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
    cursor:pointer;user-select:none;flex:0 0 auto;color:rgba(160,205,240,.8);
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;}
  #panelHead:hover{color:rgba(200,232,255,.95);}
  #chev{transition:transform .22s ease;font-size:11px;opacity:.75;}
  #panelBody{padding:0 15px 13px;overflow-y:auto;}
  #panel.collapsed{width:auto;}
  #panel.collapsed #panelBody{display:none;}
  #panel.collapsed #chev{transform:rotate(-90deg);}
  #panel.collapsed .lbl{margin-right:10px;}
  .row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;}
  .row label{text-transform:uppercase;}
  .val{color:rgba(190,225,255,.95);font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;height:2px;margin:4px 0 0;appearance:none;
    background:rgba(100,170,255,.18);border-radius:2px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:9px;height:9px;border-radius:50%;
    background:#7cc4ff;box-shadow:0 0 8px rgba(120,190,255,.8);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;border:none;border-radius:50%;background:#7cc4ff;cursor:pointer;}
  .grp{margin-bottom:9px;}
  .hd{color:rgba(130,180,230,.42);font-size:9px;letter-spacing:.18em;
    border-bottom:1px solid rgba(100,170,255,.1);padding-bottom:5px;margin:2px 0 9px;}
  button{width:100%;margin-top:4px;padding:6px;background:rgba(100,170,255,.08);
    border:1px solid rgba(100,170,255,.2);border-radius:3px;color:rgba(180,218,255,.85);
    font-family:inherit;font-size:9px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;}
  button:hover{background:rgba(100,170,255,.16);}
  #err{position:absolute;inset:0;z-index:99;display:none;padding:34px;overflow:auto;
    background:#050a14;color:#ff9a9a;font-size:12px;line-height:1.55;white-space:pre-wrap;}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="panel">
  <div id="panelHead" role="button" tabindex="0" aria-expanded="true">
    <span class="lbl">Controls</span><span id="chev">&#9662;</span>
  </div>
  <div id="panelBody">
    <div class="hd" style="margin-top:0">Water</div>
    <div class="grp"><div class="row"><label>Population</label><span class="val" id="v-pop">9</span></div>
      <input type="range" id="s-pop" min="1" max="16" step="1" value="9"></div>
    <div class="grp"><div class="row"><label>Current</label><span class="val" id="v-cur">0.60</span></div>
      <input type="range" id="s-cur" min="0" max="2" step="0.05" value="0.6"></div>
    <div class="grp"><div class="row"><label>Viscosity</label><span class="val" id="v-vis">1.00</span></div>
      <input type="range" id="s-vis" min="0.3" max="2.5" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Eddies</label><span class="val" id="v-edd">1.00</span></div>
      <input type="range" id="s-edd" min="0" max="2.5" step="0.05" value="1.0"></div>

    <div class="hd">Animal</div>
    <div class="grp"><div class="row"><label>Pulse rate</label><span class="val" id="v-rate">1.00</span></div>
      <input type="range" id="s-rate" min="0.3" max="2.2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Pulse depth</label><span class="val" id="v-pd">1.00</span></div>
      <input type="range" id="s-pd" min="0" max="2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Wander</label><span class="val" id="v-wan">1.00</span></div>
      <input type="range" id="s-wan" min="0" max="2.5" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Tangle</label><span class="val" id="v-tang">1.00</span></div>
      <input type="range" id="s-tang" min="0" max="2" step="0.05" value="1.0"></div>

    <div class="hd">Medium</div>
    <div class="grp"><div class="row"><label>Density</label><span class="val" id="v-dens">1.00</span></div>
      <input type="range" id="s-dens" min="0.2" max="2.5" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Scatter</label><span class="val" id="v-scat">1.00</span></div>
      <input type="range" id="s-scat" min="0" max="2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Tissue</label><span class="val" id="v-tis">1.00</span></div>
      <input type="range" id="s-tis" min="0" max="2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Emission</label><span class="val" id="v-emis">1.00</span></div>
      <input type="range" id="s-emis" min="0" max="2" step="0.05" value="1.0"></div>

    <div class="hd">Camera</div>
    <div class="grp"><div class="row"><label>Shutter</label><span class="val" id="v-shut">0.50</span></div>
      <input type="range" id="s-shut" min="0.1" max="1" step="0.02" value="0.5"></div>
    <div class="grp"><div class="row"><label>Bloom</label><span class="val" id="v-glow">1.00</span></div>
      <input type="range" id="s-glow" min="0" max="2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Shafts</label><span class="val" id="v-shafts">1.00</span></div>
      <input type="range" id="s-shafts" min="0" max="2.5" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Grain</label><span class="val" id="v-grain">1.00</span></div>
      <input type="range" id="s-grain" min="0" max="2" step="0.05" value="1.0"></div>
    <div class="grp"><div class="row"><label>Quality</label><span class="val" id="v-qual">0.80</span></div>
      <input type="range" id="s-qual" min="0.4" max="1.4" step="0.05" value="0.8"></div>
    <button id="btn-reset">Reseed</button>
  </div>
</div>
<div id="err"></div>

<script>
"use strict";
(function(){

const errEl=document.getElementById('err');
function fatal(msg){
  errEl.style.display='block';
  errEl.textContent=msg;
  throw new Error(msg);
}

/* ═══════════════════════════════════════════════════════════
   GL CONTEXT
   ═══════════════════════════════════════════════════════════ */
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,depth:false,
                                 premultipliedAlpha:false,powerPreference:'high-performance'});
if(!gl) fatal('WebGL2 is not available in this browser.\n\nThis renderer raymarches volumetric density fields on the GPU and needs WebGL2. Chrome, Edge, Firefox and Safari 15+ all support it.');

const floatOK = !!gl.getExtension('EXT_color_buffer_float');
const linOK   = !!gl.getExtension('OES_texture_float_linear');
const HDR_FMT = floatOK ? gl.RGBA16F : gl.RGBA8;
const HDR_TYPE= floatOK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

/* ═══════════════════════════════════════════════════════════
   SHADER PLUMBING
   ═══════════════════════════════════════════════════════════ */
function sh(type,src,name){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    const lines=src.split('\n').map((l,i)=>String(i+1).padStart(4)+' | '+l).join('\n');
    fatal('Shader compile failed ['+name+']\n\n'+log+'\n\n'+lines);
  }
  return s;
}
function prog(vs,fs,name){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs,name+':vert'));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs,name+':frag'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) fatal('Link failed ['+name+']\n\n'+gl.getProgramInfoLog(p));
  p.u=new Proxy({},{get:(t,k)=>{
    if(!(k in t)) t[k]=gl.getUniformLocation(p,k);
    return t[k];
  }});
  return p;
}

/* ── fullscreen triangle ─────────────────────────────────── */
const quadVAO=gl.createVertexArray();
{
  gl.bindVertexArray(quadVAO);
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
}
const VS_QUAD=`#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;

/* ═══════════════════════════════════════════════════════════
   COMMON GLSL — hash + value noise, used for tissue detail
   ═══════════════════════════════════════════════════════════ */
const NOISE=`
float hash13(vec3 p){
  p=fract(p*0.1031);
  p+=dot(p,p.zyx+31.32);
  return fract((p.x+p.y)*p.z);
}
float vnoise(vec3 x){
  vec3 i=floor(x), f=fract(x);
  f=f*f*(3.0-2.0*f);
  float n000=hash13(i+vec3(0,0,0)), n100=hash13(i+vec3(1,0,0));
  float n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1));
  float n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
             mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm(vec3 p){
  return 0.58*vnoise(p) + 0.29*vnoise(p*2.03) + 0.13*vnoise(p*4.07);
}`;

/* ═══════════════════════════════════════════════════════════
   PROGRAM: BACKGROUND  (water gradient + volumetric shafts)
   ═══════════════════════════════════════════════════════════ */
const bgProg=prog(VS_QUAD,`#version 300 es
precision highp float;
in vec2 vUV;
out vec4 frag;
uniform vec2 uRes;
uniform float uTime, uShafts;
uniform vec2 uLightDir2;
${NOISE}
void main(){
  vec2 p=vec2(vUV.x, 1.0-vUV.y);
  vec3 col=mix(vec3(0.004,0.043,0.110), vec3(0.000,0.004,0.024), smoothstep(0.0,1.0,p.y));
  float halo=exp(-pow(distance(p,vec2(0.5,-0.28))*1.35,1.7));
  col+=vec3(0.039,0.172,0.410)*halo*0.30;

  if(uShafts>0.001){
    // rotate into the key light's frame so shafts run exactly
    // parallel to the direction the light travels
    vec2 d=normalize(uLightDir2);
    vec2 q=vec2(dot(p-0.5,d), dot(p-0.5,vec2(-d.y,d.x)));
    float acc=0.0;
    for(int i=0;i<6;i++){
      float fi=float(i);
      float off=(fi/6.0-0.5)*1.5 + sin(uTime*0.055+fi*1.9)*0.10;
      float w=0.030+0.030*(0.5+0.5*sin(fi*2.4+uTime*0.05));
      float band=exp(-pow(abs(q.y-off)/w,2.0));
      float along=smoothstep(-0.9,-0.1,q.x)*smoothstep(0.95,0.0,q.x);
      acc+=band*along*(0.55+0.45*sin(fi*1.3+uTime*0.08));
    }
    acc*=0.9+0.35*fbm(vec3(p*7.0, uTime*0.06));
    col+=vec3(0.16,0.42,0.85)*acc*0.085*uShafts;
  }
  frag=vec4(col,1.0);
}`,'background');

/* ═══════════════════════════════════════════════════════════
   PROGRAM: VOLUMETRIC BELL

   Each animal is drawn as one screen-space billboard. For every
   covered pixel we build a camera ray, intersect it with the
   animal's bounding sphere, and raymarch the density field
   inside. Radiance accumulates front-to-back with Beer-Lambert
   extinction, and each sample takes a short secondary march
   toward the key light for single scattering. That secondary
   march is what produces real self-shadowing and the deep glow
   through the gel — the thing 2D compositing fundamentally
   cannot do.
   ═══════════════════════════════════════════════════════════ */
const bellProg=prog(`#version 300 es
layout(location=0) in vec2 aPos;
uniform vec2 uRes;
uniform vec2 uCenterPx;
uniform float uRadPx;
void main(){
  vec2 px=uCenterPx+aPos*uRadPx;
  vec2 clip=vec2(px.x/uRes.x*2.0-1.0, 1.0-px.y/uRes.y*2.0);
  gl_Position=vec4(clip,0.0,1.0);
}`,`#version 300 es
precision highp float;
out vec4 frag;

uniform vec2  uRes;
uniform float uFocal;
uniform vec3  uCenter;      // camera-space centre
uniform mat3  uRot;         // local -> camera
uniform float uR, uH, uThick, uBound;
uniform vec3  uColor;
uniform float uLapK, uLapA, uLapPh, uSeed, uSoft;
uniform float uCanalN, uCanalAmp, uGonad, uArm;
uniform vec3  uColor2;
uniform vec3  uLight;       // direction light travels, camera space
uniform float uDensity, uScatter, uTissue, uEmissive, uTime, uFade;
uniform int   uSteps;
${NOISE}

/* ═══════════ ANATOMY ═══════════════════════════════════════
   Real medusan structure, expressed directly in the density
   field rather than drawn on top of it. Three tiers, cheapest
   first, because the shadow march runs several times per step
   and does not need the fine parts.
   ══════════════════════════════════════════════════════════ */

/* Tier 1 — the bell shell alone. Used for self-shadowing. */
float shellOnly(vec3 p){
  float y=p.y;
  if(y<-uThick*1.4) return 0.0;
  float r=length(p.xz);
  float th=atan(p.z,p.x);
  float R=uR*(1.0+uLapA*cos(th*uLapK+uLapPh));
  /* Mesogloea is thickest over the apex and thins toward the
     margin — that gradient is why a real bell reads as a
     lens rather than a uniform rubber cap. */
  float yn=clamp(y/uH,0.0,1.0);
  float Tk=uThick*(0.48+0.95*yn);
  float Ri=R-Tk, Hi=uH-Tk;
  if(Ri<=0.001||Hi<=0.001) return 0.0;
  float eo=(r*r)/(R*R)+(y*y)/(uH*uH);
  float ei=(r*r)/(Ri*Ri)+(y*y)/(Hi*Hi);
  float k=0.30+uSoft;
  return max(0.0, smoothstep(1.0+k,1.0-k*0.55,eo)
                 *smoothstep(1.0-k*0.55,1.0+k,ei)
                 *smoothstep(-Tk*1.3,Tk*0.5,y));
}

/* Four horseshoe gonads ringing the stomach — the single most
   recognisable feature of a medusa seen from above. */
float gonads(vec3 p){
  float r=length(p.xz), th=atan(p.z,p.x);
  float dr=(r-uR*0.34)/(uR*0.15);
  float dy=(p.y-uH*0.21)/(uH*0.15);
  float g=exp(-(dr*dr+dy*dy));
  float lobes=smoothstep(0.18,0.80,abs(cos(th*2.0+uLapPh*0.5)));
  return g*lobes;
}

/* Manubrium and oral arms: the frilled feeding structure that
   hangs beneath the mouth, quite separate from the tentacles
   at the margin. Its absence was a real anatomical hole. */
/* Manubrium and oral arms: the frilled feeding structure that
   hangs beneath the mouth, quite separate from the tentacles
   at the margin. */
float oralArms(vec3 p){
  float y=p.y;
  float reach=uH*0.80*uArm;
  if(y>uH*0.06 || y<-reach || uArm<0.02) return 0.0;
  float t=(-y)/max(reach,0.001);
  float r=length(p.xz), th=atan(p.z,p.x);
  float twist=th+t*2.4;
  float rad=uR*0.22*(1.0-t*0.62)*(1.0+0.62*cos(twist*4.0));
  float d=smoothstep(rad,rad*0.30,r);
  d*=smoothstep(1.0,0.62,t)*smoothstep(-0.02,0.16,t+0.02);
  return d*0.80;
}

/* Tier 2 — full physical structure. */
float densityBase(vec3 p){
  float d=shellOnly(p);
  // radial canals: denser channels running apex to margin
  if(d>0.0){
    float th=atan(p.z,p.x);
    float canal=pow(max(0.0,cos(th*uCanalN)),10.0);
    d*=1.0+canal*0.45*uCanalAmp;
    d+=gonads(p)*uGonad*0.9;
  } else {
    d+=gonads(p)*uGonad*0.55;
  }
  d+=oralArms(p);
  return max(d,0.0);
}

/* Tier 3 — density plus the emissive weight of bright tissue. */
vec2 sampleMedium(vec3 p){
  float d=densityBase(p);
  if(d<=0.0) return vec2(0.0);
  float n=0.66*vnoise(p*(7.8/uR))+0.34*vnoise(p*(16.4/uR)+vec3(uSeed));
  d*=mix(1.0,0.42+1.10*n,uTissue*0.55);

  float r=length(p.xz), th=atan(p.z,p.x);
  float glow=0.0;
  // canals carry more light than the gel around them
  glow+=pow(max(0.0,cos(th*uCanalN)),10.0)*0.55*uCanalAmp;
  // gonads read brighter and slightly warmer
  glow+=gonads(p)*1.30*uGonad;
  /* Rhopalia — the eight sensory organs spaced around the bell
     margin. Tiny, but they are the brightest points on a real
     animal and the eye finds them immediately. */
  float dr=(r-uR)/(uR*0.075), dy=p.y/(uH*0.06);
  glow+=exp(-(dr*dr+dy*dy))*pow(max(0.0,cos(th*8.0+uLapPh)),40.0)*3.2;
  // ring canal running around the margin
  float rr=(r-uR*0.90)/(uR*0.05), ry=p.y/(uH*0.05);
  glow+=exp(-(rr*rr+ry*ry))*0.42;
  return vec2(d,glow);
}

void main(){
  mat3 rotT=transpose(uRot);
  vec2 px=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  vec3 rd=normalize(vec3(px.x-uRes.x*0.5, px.y-uRes.y*0.5, uFocal));

  // ray / bounding sphere
  vec3 oc=-uCenter;
  float b=dot(oc,rd);
  float c=dot(oc,oc)-uBound*uBound;
  float disc=b*b-c;
  if(disc<0.0) discard;
  float sq=sqrt(disc);
  float t0=max(-b-sq,0.0), t1=-b+sq;
  if(t1<=t0) discard;

  int STEPS=uSteps;
  float dt=(t1-t0)/float(STEPS);
  // dithered start kills slice banding
  float jitter=hash13(vec3(gl_FragCoord.xy,uTime*60.0));
  float t=t0+dt*jitter;

  vec3 Ll=normalize(rotT*(-uLight));   // toward the source, local space
  vec3 acc=vec3(0.0);
  float T=1.0;
  float absorb=0.85*uDensity;

  for(int i=0;i<96;i++){
    if(i>=STEPS || T<0.012) break;
    vec3 pc=rd*t;
    vec3 pl=rotT*(pc-uCenter);
    vec2 sm=sampleMedium(pl);
    float d=sm.x;
    if(d>0.012){
      float a=1.0-exp(-d*absorb*dt*0.028);
      // secondary march toward the key light
      float sh=0.0;
      for(int j=1;j<=3;j++){
        sh+=shellOnly(pl+Ll*(float(j)*uR*0.30));
      }
      float trans=exp(-sh*0.55*uDensity);
      // forward scattering lobe: gel glows where light passes
      // through it toward the lens
      float ph=0.30+0.70*pow(max(-dot(rd,uLight),0.0),2.0);
      vec3 tint=mix(uColor,uColor2,clamp(sm.y*0.55,0.0,1.0));
      vec3 lit=tint*(0.16+1.25*trans*ph)*uScatter;
      vec3 emis=tint*(0.30+sm.y*0.85)*uEmissive;
      acc+=T*a*(lit+emis);
      T*=(1.0-a);
    }
    t+=dt;
  }
  float alpha=(1.0-T)*uFade;
  if(alpha<0.002) discard;
  frag=vec4(acc*uFade,alpha);   // premultiplied
}`,'bell');

/* ═══════════════════════════════════════════════════════════
   PROGRAM: TENTACLES
   Screen-space quads with a Gaussian cross-section — a real
   filament of light rather than a flat stroke.
   ═══════════════════════════════════════════════════════════ */
const lineProg=prog(`#version 300 es
layout(location=0) in vec2  aPos;
layout(location=1) in float aU;
layout(location=2) in float aA;
layout(location=3) in vec3  aCol;
uniform vec2 uRes;
out float vU; out float vA; out vec3 vCol;
void main(){
  vU=aU; vA=aA; vCol=aCol;
  vec2 clip=vec2(aPos.x/uRes.x*2.0-1.0, 1.0-aPos.y/uRes.y*2.0);
  gl_Position=vec4(clip,0.0,1.0);
}`,`#version 300 es
precision highp float;
in float vU; in float vA; in vec3 vCol;
out vec4 frag;
void main(){
  float g=exp(-vU*vU*2.9);      // Gaussian across the filament
  frag=vec4(vCol*vA*g,0.0);     // additive
}`,'tentacle');

   POST: bright-pass, blur, composite
   ═══════════════════════════════════════════════════════════ */
const brightProg=prog(VS_QUAD,`#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform sampler2D uTex; uniform float uThresh;
void main(){
  vec3 c=texture(uTex,vUV).rgb;
  float l=dot(c,vec3(0.2126,0.7152,0.0722));
  frag=vec4(c*smoothstep(uThresh,uThresh*2.2,l),1.0);
}`,'bright');

const blurProg=prog(VS_QUAD,`#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec3 s=texture(uTex,vUV).rgb*0.227027;
  s+=texture(uTex,vUV+uDir*1.3846).rgb*0.316216;
  s+=texture(uTex,vUV-uDir*1.3846).rgb*0.316216;
  s+=texture(uTex,vUV+uDir*3.2308).rgb*0.070270;
  s+=texture(uTex,vUV-uDir*3.2308).rgb*0.070270;
  frag=vec4(s,1.0);
}`,'blur');

const compProg=prog(VS_QUAD,`#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform sampler2D uScene, uBloom;
uniform vec2 uRes;
uniform float uBloomAmt, uGrain, uTime;
${NOISE}
void main(){
  vec3 c=texture(uScene,vUV).rgb;
  // slight chromatic spread on the bloom, as a real lens has
  vec3 b;
  b.r=texture(uBloom,vUV+vec2( 0.0016,0.0)).r;
  b.g=texture(uBloom,vUV).g;
  b.b=texture(uBloom,vUV-vec2( 0.0016,0.0)).b;
  c+=b*uBloomAmt;

  // filmic tonemap keeps highlights from clipping flat
  c=(c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14);

  float v=distance(vUV,vec2(0.5));
  c*=smoothstep(1.05,0.32,v)*0.55+0.45;

  float n=hash13(vec3(gl_FragCoord.xy,floor(uTime*24.0)));
  c+=(n-0.5)*0.030*uGrain;

  frag=vec4(max(c,0.0),1.0);
}`,'composite');

/* ═══════════════════════════════════════════════════════════
   RENDER TARGETS
   ═══════════════════════════════════════════════════════════ */
function makeTarget(w,h,fmt,type){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,fmt,w,h,0,gl.RGBA,type,null);
  const filt=(fmt===gl.RGBA8||linOK)?gl.LINEAR:gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filt);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filt);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(ok!==gl.FRAMEBUFFER_COMPLETE) fatal('Framebuffer incomplete (0x'+ok.toString(16)+') at '+w+'x'+h);
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex,fbo,w,h};
}
let sceneRT=null, accumRT=null, prevRT=null, brightRT=null, blurRT=null;
let W=0,H=0,RW=0,RH=0,DPR=1;

function allocTargets(){
  for(const t of [sceneRT,accumRT,prevRT,brightRT,blurRT]){
    if(t){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
  }
  sceneRT =makeTarget(RW,RH,HDR_FMT,HDR_TYPE);
  accumRT =makeTarget(RW,RH,HDR_FMT,HDR_TYPE);
  prevRT  =makeTarget(RW,RH,HDR_FMT,HDR_TYPE);
  const bw=Math.max(1,RW>>2), bh=Math.max(1,RH>>2);
  brightRT=makeTarget(bw,bh,HDR_FMT,HDR_TYPE);
  blurRT  =makeTarget(bw,bh,HDR_FMT,HDR_TYPE);
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  RW=Math.max(2,Math.floor(W*DPR*P.quality));
  RH=Math.max(2,Math.floor(H*DPR*P.quality));
  allocTargets();
}

/* ═══════════════════════════════════════════════════════════
   PARAMETERS
   ═══════════════════════════════════════════════════════════ */
const P={population:9,current:0.6,viscosity:1.0,pulseRate:1.0,pulseDepth:1.0,
         wander:1.0,tangle:1.0,eddies:1.0,density:1.0,scatter:1.0,tissue:1.0,emissive:1.0,
         shutter:0.5,bloom:1.0,shafts:1.0,grain:1.0,quality:0.8};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

/* camera: pinhole at the origin looking down +Z */
const CAM={F:760,near:260,far:1750};
const LIGHT={x:0.42,y:0.82,z:-0.39};
(function(){const m=Math.hypot(LIGHT.x,LIGHT.y,LIGHT.z);
  LIGHT.x/=m;LIGHT.y/=m;LIGHT.z/=m;})();
const LDIR2=(()=>{const m=Math.hypot(LIGHT.x,LIGHT.y);return {x:LIGHT.x/m,y:LIGHT.y/m};})();

/* ═══════════════════════════════════════════════════════════
   FLUID
   ═══════════════════════════════════════════════════════════ */
const Fluid={
  t:0,
  /* Large-scale drift plus fine-scale eddies.

     The broad field has a wavelength of ~3900 units and a
     tentacle is ~480, so it varies barely 12% end to end —
     effectively uniform. A uniform force cannot bend a chain,
     it only translates it, which is exactly why the filaments
     came out as perfectly rigid rays. Real water carries
     structure at every scale; these two extra octaves, at
     wavelengths of roughly 250 and 90 units, give the water
     something to push differently on the tip than on the base.
     Written as the curl of a scalar potential so the flow is
     divergence-free and reads as swirling rather than as
     sources and sinks. */
  velocityAt(x,y,out){
    const s=0.0016,t=this.t;
    let vx=(Math.sin(y*s     +t*0.22)*14+Math.sin(y*s*2.3-t*0.15)*6+Math.cos(x*s*0.7+t*0.11)*4)*P.current;
    let vy=(Math.cos(x*s*1.1 -t*0.19)*9 +Math.cos(x*s*2.7+t*0.13)*4-2)*P.current;


    const sp=Math.hypot(vx,vy),MAX=520;
    if(sp>MAX){const k=MAX/sp;vx*=k;vy*=k;}
    out.x=isFinite(vx)?vx:0; out.y=isFinite(vy)?vy:0;
    return out;
  },

  /* Coarse flow plus fine eddies, for thin structures only.

     A bell is far larger than these eddies and averages over
     them, so bodies keep using the smooth field above; a
     tentacle is thinner than one and feels the whole swirl.
     That size-dependent filtering is real, and it is what
     finally lets the water shape a filament: the broad field
     varies barely 12% over a tentacle's length, which is
     effectively uniform, and a uniform force cannot bend a
     chain — it only moves it. These two octaves, at roughly
     250 and 90 world units, are written as the curl of a
     potential so the flow stays divergence-free and reads as
     swirling rather than as sources and sinks. */
  fineAt(x,y,out){
    this.velocityAt(x,y,out);
    const t=this.t, e1=0.0250, e2=0.0700, a1=150.0, a2=64.0;
    const s1=Math.sin(x*e1*0.8-t*0.31), c1=Math.cos(y*e1+t*0.55);
    const s2=Math.sin(x*e2*1.1+t*0.62), c2=Math.cos(y*e2-t*0.90);
    const s1b=Math.sin(y*e1+t*0.55), c1b=Math.cos(x*e1*0.8-t*0.31);
    const s2b=Math.sin(y*e2-t*0.90), c2b=Math.cos(x*e2*1.1+t*0.62);
    out.x += (c1*s1*a1 + c2*s2*a2)*P.eddies;
    out.y += (-s1b*c1b*a1*0.8 - s2b*c2b*a2*0.8)*P.eddies;
    return out;
  }
};
const _v={x:0,y:0};

/* ═══════════════════════════════════════════════════════════
   VERLET FILAMENT  (unchanged physics, screen space)
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   VERLET FILAMENT — 3D

   These used to be flat chains living in screen space, which
   meant a tentacle could never foreshorten as it swung toward
   the lens, never dim with its own depth, and never pass
   behind the bell along its length (only its anchor decided).
   They now live in the same camera-space the volume shader
   uses, and every node is projected individually.

   A side effect worth having: rest length is fixed in WORLD
   units. Previously it was rescaled by the depth factor each
   frame, so a tentacle physically stretched as its owner swam
   toward the camera.
   ═══════════════════════════════════════════════════════════ */
class Filament{
  constructor(n,seg,o){
    this.n=n; this.seg=seg;
    this.px=new Float32Array(n); this.py=new Float32Array(n); this.pz=new Float32Array(n);
    this.ox=new Float32Array(n); this.oy=new Float32Array(n); this.oz=new Float32Array(n);
    this.width=o.width; this.drag=o.drag; this.stiff=o.stiff;
    this.bend=o.bend!==undefined?o.bend:0.26;
    this.jit=new Float32Array(n-1); this.sjit=new Float32Array(n-1);
    for(let i=0;i<n-1;i++){ this.jit[i]=0.88+Math.random()*0.26;
                            this.sjit[i]=0.86+Math.random()*0.20; }
    this.seeded=false;
  }
  seed(x,y,z,dx,dy,dz){
    for(let i=0;i<this.n;i++){
      this.px[i]=this.ox[i]=x+dx*i*this.seg;
      this.py[i]=this.oy[i]=y+dy*i*this.seg;
      this.pz[i]=this.oz[i]=z+dz*i*this.seg;
    }
    this.seeded=true;
  }
  step(dt,ax,ay,az,hx,hy,hz,camX,camY,k,dirx,diry,dirz){
    if(!this.seeded) this.seed(hx,hy,hz,dirx,diry,dirz);
    const n=this.n;
    const px=this.px,py=this.py,pz=this.pz,ox=this.ox,oy=this.oy,oz=this.oz;
    const MAXD=this.seg*1.5;
    const inv=1/(n-1);
    /* Sampled per node, not per filament. Sampling once and
       reusing it was a false economy: it made the force
       identical along the whole length, which is precisely
       what kept these rigid. */
    for(let i=1;i<n;i++){
      Fluid.fineAt(W*0.5+px[i]*k, H*0.5+py[i]*k, _v);
      const tx=_v.x/k*dt, ty=_v.y/k*dt;
      /* Drag rises along the filament. A real tentacle is
         thinnest and least massive at the tip, so the tip is
         dominated by the water while the base is dominated by
         the anchor — which is why motion visibly TRAVELS from
         bell to tip instead of the whole thing swinging at
         once. That travelling delay is the natural undulation;
         it does not need to be drawn on. */
      const du=this.drag*(0.50+1.25*(i*inv));
      // sink grows toward the tip: thin ends lag and trail below
      const sink=az*(0.55+0.90*(i*inv));
      const damp=1-clamp(du*P.viscosity*dt*6,0,0.92);
      const c=clamp(du*P.viscosity*dt*3.2,0,0.6);
      let fx=px[i],fy=py[i],fz=pz[i];
      if(!isFinite(fx)||!isFinite(fy)||!isFinite(fz)){
        fx=px[i]=ox[i]=hx; fy=py[i]=oy[i]=hy; fz=pz[i]=oz[i]=hz;
      }
      let vx=(fx-ox[i])*damp, vy=(fy-oy[i])*damp, vz=(fz-oz[i])*damp;
      vx+=(tx-vx)*c; vy+=(ty-vy)*c; vz+=(0-vz)*c*0.5;
      const sp=Math.hypot(vx,vy,vz);
      if(sp>MAXD){ const k=MAXD/sp; vx*=k; vy*=k; vz*=k; }
      ox[i]=fx; oy[i]=fy; oz[i]=fz;
      px[i]=fx+vx+ax*dt*dt; py[i]=fy+vy+sink*dt*dt; pz[i]=fz+vz+ax*dt*dt*0.15;
    }
    ox[0]=px[0]; oy[0]=py[0]; oz[0]=pz[0];
    px[0]=hx; py[0]=hy; pz[0]=hz;

    const bend=this.bend;
    for(let k=0;k<3;k++){
      /* Flexural rigidity, falling off toward the tip because
         it scales with thickness and the filament tapers.
         Without it a slack chain buckles at one-segment
         wavelength, which reads as a zigzag. */
      for(let i=1;i<n-1;i++){
        const u=i/(n-1);
        const b=bend*Math.pow(1-u,1.5);
        px[i]+=(((px[i-1]+px[i+1])*0.5)-px[i])*b;
        py[i]+=(((py[i-1]+py[i+1])*0.5)-py[i])*b;
        pz[i]+=(((pz[i-1]+pz[i+1])*0.5)-pz[i])*b;
      }
      for(let i=0;i<n-1;i++){
        const dx=px[i+1]-px[i], dy=py[i+1]-py[i], dz=pz[i+1]-pz[i];
        const d=Math.hypot(dx,dy,dz)||1e-6;
        const rest=this.seg*this.jit[i];
        /* Inextensible, but with almost no resistance to going
           slack — tentacle tissue simply bunches. */
        const kk=(d>rest? this.stiff : this.stiff*0.15)*this.sjit[i];
        const diff=(d-rest)/d*kk;
        const mx=dx*diff, my=dy*diff, mz=dz*diff;
        if(i===0){ px[1]-=mx; py[1]-=my; pz[1]-=mz; }
        else {
          px[i]+=mx*0.5; py[i]+=my*0.5; pz[i]+=mz*0.5;
          px[i+1]-=mx*0.5; py[i+1]-=my*0.5; pz[i+1]-=mz*0.5;
        }
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   TANGLE — tentacle/tentacle interaction

   Until now every filament was invisible to every other, so
   they passed straight through one another. Real tentacles
   cannot: they crowd, slide against each other and gather into
   ropes, and a dense set spends most of its time in contact.

   Resolved with a uniform spatial hash over every node in the
   scene. Two ranges, because two different things are going on
   physically: short-range repulsion stops interpenetration,
   and a weaker mid-range cohesion reproduces the way long
   tentacles bundle instead of fanning out evenly.

   Corrections are gathered Jacobi-style (accumulate all, then
   apply) rather than applied in place, so the result does not
   depend on node ordering and cannot oscillate.
   ═══════════════════════════════════════════════════════════ */
const Tangle={
  MAX:24000,
  TABLE:1<<14,
  CELL:18,            // world units; must be >= R_PULL
  R_PUSH:6.5,         // below this, nodes push apart
  R_COH:9.8,          // cohesion starts here, NOT at R_PUSH
  R_PULL:18.0,        // and fades out again by here

  n:0,
  x:new Float32Array(24000), y:new Float32Array(24000), z:new Float32Array(24000),
  dx:new Float32Array(24000), dy:new Float32Array(24000), dz:new Float32Array(24000),
  fil:new Array(24000), idx:new Int32Array(24000), tag:new Int32Array(24000),
  cnt:new Int32Array((1<<14)+1), order:new Int32Array(24000), key:new Int32Array(24000),

  hash(ix,iy,iz){
    return ((ix*73856093)^(iy*19349663)^(iz*83492791))&(this.TABLE-1);
  },

  /* Only the 13 lexicographically-forward neighbour offsets.
     Scanning all 26 finds every pair from both ends and does
     the work twice; forward-only plus a j>i test inside the
     node's own cell visits each pair exactly once. */
  OFF:(()=>{const o=[];
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++)
      if(a>0||(a===0&&b>0)||(a===0&&b===0&&c>0)) o.push(a,b,c);
    return new Int8Array(o);})(),

  gather(list){
    this.n=0;
    let tag=0;
    for(const j of list){
      for(const t of j.tentacles){
        const f=t.f;
        // skip the first couple of nodes: they belong to the
        // anchor and fighting it just jitters the base
        for(let i=2;i<f.n;i++){
          if(this.n>=this.MAX) return;
          const k=this.n++;
          this.x[k]=f.px[i]; this.y[k]=f.py[i]; this.z[k]=f.pz[i];
          this.fil[k]=f; this.idx[k]=i; this.tag[k]=tag;
          this.dx[k]=0; this.dy[k]=0; this.dz[k]=0;
        }
        tag++;
      }
    }
  },

  build(){
    const n=this.n, C=this.CELL, cnt=this.cnt, T=this.TABLE;
    cnt.fill(0,0,T+1);
    for(let i=0;i<n;i++){
      const h=this.hash(Math.floor(this.x[i]/C),Math.floor(this.y[i]/C),Math.floor(this.z[i]/C));
      this.key[i]=h; cnt[h+1]++;
    }
    for(let i=0;i<T;i++) cnt[i+1]+=cnt[i];
    const fill=this.cursor||(this.cursor=new Int32Array(T));
    fill.set(cnt.subarray(0,T));
    for(let i=0;i<n;i++) this.order[fill[this.key[i]]++]=i;
  },

  resolve(strength){
    if(strength<=0.001||this.n<2) return;
    const n=this.n,C=this.CELL,cnt=this.cnt,order=this.order,OFF=this.OFF;
    const RP=this.R_PUSH, RS=this.R_COH, RC=this.R_PULL;
    const RC2=RC*RC, span=RC-RS;
    // cohesion must stay well under repulsion or bundles collapse
    // through themselves and the pair oscillates instead of settling
    const push=0.42*strength, pull=0.0275*strength;
    const X=this.x,Y=this.y,Z=this.z,DX=this.dx,DY=this.dy,DZ=this.dz,TG=this.tag;

    for(let i=0;i<n;i++){
      const xi=X[i], yi=Y[i], zi=Z[i], ti=TG[i];
      const cx=Math.floor(xi/C), cy=Math.floor(yi/C), cz=Math.floor(zi/C);

      for(let pass=0;pass<14;pass++){
        let h, selfCell=false;
        if(pass===0){ h=this.hash(cx,cy,cz); selfCell=true; }
        else{
          const o=(pass-1)*3;
          h=this.hash(cx+OFF[o],cy+OFF[o+1],cz+OFF[o+2]);
        }
        const s0=cnt[h], e0=cnt[h+1];
        for(let q=s0;q<e0;q++){
          const j=order[q];
          if(selfCell ? j<=i : j===i) continue;
          if(TG[j]===ti) continue;      // same filament: the chain owns it
          const ddx=X[j]-xi, ddy=Y[j]-yi, ddz=Z[j]-zi;
          const d2=ddx*ddx+ddy*ddy+ddz*ddz;
          if(d2>RC2||d2<1e-6) continue;
          const d=Math.sqrt(d2), inv=1/d;
          let w;
          /* A dead band between separation and cohesion is
             essential. With cohesion starting at R_PUSH, the
             diagonal pairs one node up and down the neighbouring
             filament sit just outside the push radius — four of
             them out-pull the single repulsion pair and the
             bundle collapses through itself. The shelf leaves
             repulsion unopposed near contact. */
          if(d<RP)      w=-push*(RP-d)*inv;
          else if(d>RS){ const u=(d-RS)/span; w=pull*u*(1-u)*4.0*inv; }
          else continue;
          const mx=ddx*w*0.5, my=ddy*w*0.5, mz=ddz*w*0.5;
          DX[i]+=mx; DY[i]+=my; DZ[i]+=mz;
          DX[j]-=mx; DY[j]-=my; DZ[j]-=mz;
        }
      }
    }

    // apply, clamped so a crowded node cannot be flung
    const LIM=3.2;
    for(let i=0;i<n;i++){
      let ax=DX[i], ay=DY[i], az=DZ[i];
      const m=Math.hypot(ax,ay,az);
      if(m<1e-5) continue;
      if(m>LIM){ const k=LIM/m; ax*=k; ay*=k; az*=k; }
      const f=this.fil[i], k=this.idx[i];
      f.px[k]+=ax; f.py[k]+=ay; f.pz[k]+=az;
    }
  },

  run(list,strength){
    if(strength<=0.001) return;
    this.gather(list);
    this.build();
    this.resolve(strength);
  }
};

const PALETTE=[[0.28,0.62,1.00],[0.38,0.71,1.00],[0.22,0.52,0.98],
               [0.46,0.77,1.00],[0.25,0.58,0.99]];

/* ═══════════════════════════════════════════════════════════
   JELLYFISH
   ═══════════════════════════════════════════════════════════ */
class Jellyfish{
  constructor(){
    this.col=PALETTE[(Math.random()*PALETTE.length)|0];
    this.base=rand(0.75,1.45);
    this.R=76*this.base;              // world units
    this.Hh=92*this.base;
    this.thick=this.R*rand(0.22,0.30);
    // bounding sphere must also contain the oral arms hanging below
    this.bound=Math.max(Math.hypot(this.R,this.Hh),this.Hh*0.86)*1.14;
    this.seed=rand(0,40);
    this.id=Jellyfish.nextId++;

    this.z=rand(CAM.near,CAM.far);
    const k=CAM.F/(CAM.F+this.z);
    this.wx=(rand(0,W||1280)-(W||1280)/2)/k;
    this.wy=(rand(0,H||800)-(H||800)/2)/k;
    this.vx=0;this.vy=0;this.vz=0;
    this.pvx=0;this.pvy=0;this.pvz=0;

    this.yaw=rand(0,TAU); this.pitch=rand(-0.8,0.8);
    this.yawTarget=this.yaw; this.pitchTarget=this.pitch;
    this.yawVel=0; this.pitchVel=0;
    this.wanderPhase=rand(0,100); this.wanderRate=rand(0.03,0.085);
    this.spin=rand(0,TAU); this.spinRate=rand(-0.055,0.055);

    this.lapK=7+((Math.random()*5)|0);
    this.lapA=rand(0.05,0.12);
    this.lapPh=rand(0,TAU);

    /* Anatomy varies between individuals as much as outline
       does: canal count, gonad development and oral-arm
       length all differ animal to animal and with maturity. */
    this.canalN=[8,12,16][(Math.random()*3)|0];
    this.canalAmp=rand(0.55,1.15);
    this.gonad=rand(0.45,1.15);
    this.arm=rand(0.55,1.0);
    // paler, slightly warmer tissue for canals and gonads
    this.col2=[Math.min(1,this.col[0]*1.55+0.20),
               Math.min(1,this.col[1]*1.18+0.12),
               Math.min(1,this.col[2]*1.02+0.02)];

    this.phase=Math.random();
    this.periodMean=rand(3.2,5.4)*Math.pow(this.base,0.45);
    this.period=this.newPeriod();
    this.c=0;this.cPrev=0;this.cVel=0;

    /* Length is the single biggest thing that was wrong. Every
       tentacle used to be within ~1.6x of every other, so they
       read as a fringe. A real medusa carries a few very long
       fishing tentacles among many short marginal ones — here
       the longest run about 6x the shortest. */
    /* The reference shows on the order of twenty separable
       threads, not forty. At our gauge, forty overlapping
       filaments merge into a haze and you lose the thing that
       actually reads as a tentacle: a distinct bright line. */
    const tn=17+((Math.random()*9)|0);
    this.tentacles=[];
    const clumps=3+((Math.random()*4)|0);
    for(let i=0;i<tn;i++){
      const b=(i/tn)*TAU;
      const r=Math.random();
      const cls=r<0.14?2:(r<0.46?1:0);
      const nodes=cls===2?34:(cls===1?26:19);
      // world units now, so length is fixed regardless of depth
      const segL=(cls===2?12.5:(cls===1?8.2:5.6))*rand(0.62,1.55)*this.base;
            /* Measured against real animals these were about 11x too
         thick: a Chrysaora tentacle is roughly 1/200 of its bell
         diameter, ours were 1/19. At that gauge they read as
         noodles rather than threads. */
      const wid=(cls===2?rand(1.7,2.5):(cls===1?rand(0.95,1.6):rand(0.45,0.95)))*this.base*0.57;
      const f=new Filament(nodes,segL,
        {width:wid, drag:rand(0.45,1.15), stiff:0.88,
         bend:(cls===2?0.085:(cls===1?0.070:0.055))*rand(0.8,1.25)});
      this.tentacles.push({
        theta:b+Math.sin(b*clumps+this.seed)*0.26+rand(-0.09,0.09),
        near:false, dim:1, cls, f
      });
    }
    this.mat=new Float32Array(9);
    this.recompute();
  }

  newPeriod(){
    const j=0.82+Math.random()*0.40;
    const coast=Math.random()<0.20?1.6+Math.random()*0.9:1;
    return this.periodMean*j*coast;
  }
  breathAt(lag){
    let p=this.phase-lag+0.26;
    while(p<0)p+=1; while(p>=1)p-=1;
    return 0.5-0.5*Math.cos(p*TAU);
  }

  /* Build the local->camera basis. Column 1 (up) is the bell
     axis, so the animal always points where it swims.

     This is derived analytically from yaw and pitch. The
     obvious construction — cross the axis with some fixed
     reference vector — has to switch reference when the axis
     nears it, and that switch spins the entire animal (every
     tentacle, canal, gonad and arm) by up to 134 degrees in a
     single step. Measured: exactly the twitch that produced.
     Composing the two rotations directly has no such branch,
     so the frame is continuous everywhere. */
  recompute(){
    const cy=Math.cos(this.yaw), sy=Math.sin(this.yaw);
    const cp=Math.cos(this.pitch), spi=Math.sin(this.pitch);

    // X: yaw applied to (1,0,0)
    const x0=cy,      x1=sy,      x2=0;
    // Y: the bell axis
    const u0=cp*sy,   u1=-cp*cy,  u2=spi;
    // Z: completes a right-handed orthonormal frame
    const z0=-spi*sy, z1=spi*cy,  z2=cp;

    // roll about the animal's own axis
    const cs=Math.cos(this.spin), sn=Math.sin(this.spin);
    const M=this.mat;
    M[0]=x0*cs+z0*sn; M[1]=x1*cs+z1*sn; M[2]=x2*cs+z2*sn;   // local X
    M[3]=u0;          M[4]=u1;          M[5]=u2;            // local Y = axis
    M[6]=-x0*sn+z0*cs;M[7]=-x1*sn+z1*cs;M[8]=-x2*sn+z2*cs;  // local Z

    this.camZ=CAM.F+this.z;
    this.k=CAM.F/this.camZ;
    this.sx=W/2+this.wx*this.k;
    this.sy=H/2+this.wy*this.k;
    this.radPx=this.bound*this.k;
  }

  /* project a local-space point through the same pinhole the
     shader uses, so tentacles attach exactly to the rendered
     bell rather than to a separate 2D approximation */
  localToCam(lx,ly,lz,out){
    const M=this.mat;
    out.x=this.wx + M[0]*lx+M[3]*ly+M[6]*lz;
    out.y=this.wy + M[1]*lx+M[4]*ly+M[7]*lz;
    out.z=this.camZ + M[2]*lx+M[5]*ly+M[8]*lz;
    return out;
  }

  projectLocal(lx,ly,lz,out){
    const M=this.mat;
    const cx=this.wx + M[0]*lx+M[3]*ly+M[6]*lz;
    const cy=this.wy + M[1]*lx+M[4]*ly+M[7]*lz;
    const cz=this.camZ + M[2]*lx+M[5]*ly+M[8]*lz;
    const k=CAM.F/Math.max(60,cz);
    out.x=W/2+cx*k;
    out.y=H/2+cy*k;
    out.z=cz;
    return out;
  }

  step(dt){
    this.phase+=dt/this.period*P.pulseRate;
    if(this.phase>=1){ this.phase-=1; this.period=this.newPeriod(); }

    const CONTRACT=0.24,p=this.phase;
    this.cPrev=this.c;
    if(p<CONTRACT){const f=p/CONTRACT;this.c=f*f*(3-2*f);}
    else{const f=(p-CONTRACT)/(1-CONTRACT);this.c=clamp(Math.pow(1-f,2.4),0,1);}
    this.cVel=(this.c-this.cPrev)/Math.max(dt,1e-4);

    const A=52*54*this.base*this.base;
    let thrust=0;
    if(this.cVel>0) thrust=this.cVel*this.cVel*A*0.052;
    else if(p>CONTRACT&&p<CONTRACT+0.30) thrust=this.cVel*this.cVel*A*0.016;

    const M=this.mat;
    const ax=M[3],ay=M[4],az=M[5];
    let fx=ax*thrust, fy=ay*thrust, fz=az*thrust;

    Fluid.velocityAt(this.sx,this.sy,_v);
    const fvx=_v.x/this.k, fvy=_v.y/this.k;
    const rvx=this.vx-fvx, rvy=this.vy-fvy, rvz=this.vz;
    const rel=Math.min(Math.hypot(rvx,rvy,rvz),1200);
    const mass=1.1*this.base*this.base, mEff=mass*1.6;
    const area=A*(1-this.c*0.30)*0.00042;
    const dragK=Math.min(1.05*P.viscosity*area*rel/mEff,0.9/dt);
    fx-=dragK*rvx*mEff; fy-=dragK*rvy*mEff; fz-=dragK*rvz*mEff;
    fy-=2.0*mass;

    this.vx+=fx/mEff*dt; this.vy+=fy/mEff*dt; this.vz+=fz/mEff*dt;
    const kk=1-clamp(0.55*P.viscosity*dt,0,0.5);
    this.vx*=kk; this.vy*=kk; this.vz*=kk;
    this.wx+=this.vx*dt; this.wy+=this.vy*dt; this.z+=this.vz*dt;

    this.wanderPhase+=dt*this.wanderRate;
    this.yawTarget+=Math.sin(this.wanderPhase*1.7+this.seed)*dt*0.40*P.wander;
    this.pitchTarget=Math.sin(this.wanderPhase*0.9+this.seed*1.7)*0.85*P.wander;
    if(this.z<CAM.near+150) this.pitchTarget=-Math.abs(this.pitchTarget)-0.25;
    if(this.z>CAM.far -260) this.pitchTarget= Math.abs(this.pitchTarget)+0.25;

    let dy=this.yawTarget-this.yaw;
    while(dy> Math.PI)dy-=TAU; while(dy<-Math.PI)dy+=TAU;
    this.yawVel+=dy*1.1*dt*0.5; this.yawVel*=1-clamp(2.2*dt,0,0.9);
    this.yaw+=this.yawVel*dt;
    const dp=clamp(this.pitchTarget,-0.95,0.95)-this.pitch;
    this.pitchVel+=dp*1.3*dt*0.5; this.pitchVel*=1-clamp(2.4*dt,0,0.9);
    this.pitch=clamp(this.pitch+this.pitchVel*dt,-0.95,0.95);
    this.spin+=this.spinRate*dt;

    this.z=clamp(this.z,CAM.near,CAM.far);
    this.recompute();

    /* ── inertial whip ──────────────────────────────────
       The driving force used to be a fixed ~24 px/s^2 nudge,
       so tentacles simply hung off the anchor no matter what
       the animal did. Feeding the body's ACTUAL acceleration
       in (negated, as inertia) means every jet visibly snaps
       them straight and the following glide lets them fall
       slack again — which is most of what makes a real
       tentacle set look alive. */
    const invdt=1/Math.max(dt,1e-4);
    const accX=(this.vx-this.pvx)*invdt;
    const accY=(this.vy-this.pvy)*invdt;
    const accZ=(this.vz-this.pvz)*invdt;
    this.pvx=this.vx; this.pvy=this.vy; this.pvz=this.vz;
    const whipX=clamp(-accX*0.75,-1800,1800);
    // gravity dominates: real tentacles hang, they do not radiate
    const whipY=clamp(-accY*0.75,-1800,1800)+420;
    const whipZ=clamp(-accZ*0.75,-1800,1800);
    // one fluid sample per animal, converted to world units
    Fluid.velocityAt(this.sx,this.sy,_v);
    const fwx=_v.x/this.k, fwy=_v.y/this.k;

    /* tentacle anchors ride the true 3D margin ring */
    const pt={x:0,y:0,z:0};
    const breath=this.breathAt(0)*P.pulseDepth;
    const marginR=this.R*(1-breath*0.07);
    let reseed=false;
    const pad=this.radPx*3+240;
    if(this.sx<-pad){ this.wx=( W+pad*0.5-W/2)/this.k; reseed=true; }
    else if(this.sx>W+pad){ this.wx=(-pad*0.5-W/2)/this.k; reseed=true; }
    if(this.sy<-pad){ this.wy=( H+pad*0.5-H/2)/this.k; reseed=true; }
    else if(this.sy>H+pad){ this.wy=(-pad*0.5-H/2)/this.k; reseed=true; }
    if(reseed){ this.recompute(); for(const t of this.tentacles) t.f.seeded=false; }

    for(const t of this.tentacles){
      const th=t.theta;
      const R=marginR*(1+this.lapA*Math.cos(th*this.lapK+this.lapPh));
      this.localToCam(Math.cos(th)*R, 0, Math.sin(th)*R, pt);
      /* Only draw order is binary now. How much gel dims each
         part of the filament is evaluated per node at render
         time, so the two sides agree at the silhouette and
         nothing pops as a tentacle sweeps around. */
      t.near = pt.z < this.camZ;
      t.f.step(dt,whipX,whipY,whipZ,pt.x,pt.y,pt.z,
               this.sx,this.sy,this.k,-M[3],-M[4],-M[5]);
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   TENTACLE GEOMETRY BUFFER
   ═══════════════════════════════════════════════════════════ */
const STRIDE=7;                       // x,y,u,a,r,g,b
let vbuf=new Float32Array(1<<18);
const lineVAO=gl.createVertexArray();
const lineVBO=gl.createBuffer();
{
  gl.bindVertexArray(lineVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER,lineVBO);
  const S=STRIDE*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,S,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,S,8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,S,12);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,3,gl.FLOAT,false,S,16);
  gl.bindVertexArray(null);
}
let vcount=0;
function ensure(n){
  if(vcount*STRIDE+n*STRIDE<=vbuf.length) return;
  const nb=new Float32Array(Math.max(vbuf.length*2,(vcount+n)*STRIDE*2));
  nb.set(vbuf.subarray(0,vcount*STRIDE)); vbuf=nb;
}
function push(x,y,u,a,c){
  const o=vcount*STRIDE;
  vbuf[o]=x; vbuf[o+1]=y; vbuf[o+2]=u; vbuf[o+3]=a;
  vbuf[o+4]=c[0]; vbuf[o+5]=c[1]; vbuf[o+6]=c[2];
  vcount++;
}
/* three passes give the filament a Gaussian cross-section */
const TP=[{w:4.6,a:0.095,min:0.9},{w:1.15,a:0.78,min:0.30}];
const TG=[0.55,1.0,1.75];

const _sx=new Float32Array(96), _sy=new Float32Array(96);
const _sk=new Float32Array(96), _sa=new Float32Array(96);

/* Every node is projected on its own, so a tentacle swinging
   toward the lens genuinely foreshortens and thickens, and one
   trailing away thins and dims. Occlusion is evaluated per node
   too: a filament can now pass behind the bell partway along
   its length instead of the anchor deciding for the whole
   thing. */
function emitFilament(f,gain,col,j,time){
  const n=f.n;
  const bellR=Math.max(1,j.radPx*0.72);
  for(let i=0;i<n;i++){
    const cz=Math.max(60,f.pz[i]);
    const k=CAM.F/cz;
    let x=W/2+f.px[i]*k, y=H/2+f.py[i]*k;
    _sk[i]=k;

    /* depth occlusion: how much gel sits between this node and
       the lens. Continuous in both depth and screen radius, so
       nothing pops as the filament sweeps around. */
    let occ=1;
    const dz=cz-j.camZ;
    if(dz>0){
      const rs=Math.hypot(x-j.sx,y-j.sy)/bellR;
      const inside=1-clamp((rs-0.55)/0.70,0,1);
      const deep=clamp(dz/(j.R*0.9),0,1);
      occ=1-0.60*inside*deep;
    }
    _sa[i]=occ;
    _sx[i]=x; _sy[i]=y;
  }
  /* No authored undulation here any more. A hand-written sine
     is the one thing on a tentacle that always reads as
     animation rather than motion — it has no cause. Everything
     the filament does now comes from the anchor moving and the
     water resisting, which is the only reason a real tentacle
     ever moves. */

  for(const pass of TP){
    for(let i=0;i<n-1;i++){
      const x0=_sx[i],y0=_sy[i],x1=_sx[i+1],y1=_sy[i+1];
      let dx=x1-x0, dy=y1-y0;
      const L=Math.hypot(dx,dy);
      if(L<0.01||!isFinite(L)) continue;
      dx/=L; dy/=L;
      const u0=i/(n-1), u1=(i+1)/(n-1);
      /* Beading removed: at this gauge the reference threads are
         smooth continuous lines, and a periodic modulation was
         another authored pattern with no visible cause. */
      const bead0=1.0, bead1=1.0;
      /* Measured against the reference: a real lit tentacle is
         still at roughly 85% brightness halfway down and only
         drops off over the last third. Ours fell to 39% by the
         midpoint, which is why they read as wisps of smoke
         instead of solid glowing threads. */
      const a0=Math.pow(1-u0,0.45)*pass.a*gain*_sa[i]*bead0;
      const a1=Math.pow(1-u1,0.45)*pass.a*gain*_sa[i+1]*bead1;
      if(a0<0.002&&a1<0.002) continue;
      // width follows perspective: nearer nodes are thicker
      // a real tentacle is very nearly a constant-gauge thread
      const w0=Math.max(pass.min,f.width*_sk[i]  *pass.w*Math.pow(1-u0,0.22));
      const w1=Math.max(pass.min,f.width*_sk[i+1]*pass.w*Math.pow(1-u1,0.22));
      const n0x=-dy*w0, n0y=dx*w0, n1x=-dy*w1, n1y=dx*w1;
      ensure(6);
      push(x0-n0x,y0-n0y,-1,a0,col); push(x0+n0x,y0+n0y, 1,a0,col); push(x1-n1x,y1-n1y,-1,a1,col);
      push(x1-n1x,y1-n1y,-1,a1,col); push(x0+n0x,y0+n0y, 1,a0,col); push(x1+n1x,y1+n1y, 1,a1,col);
    }
  }
}

let jellies=[];
Jellyfish.nextId=0;
function seed(n){ jellies=[]; for(let i=0;i<n;i++) jellies.push(new Jellyfish()); }

/* ═══════════════════════════════════════════════════════════
   FRAME
   ═══════════════════════════════════════════════════════════ */
function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3); }
function bindRT(rt){
  gl.bindFramebuffer(gl.FRAMEBUFFER,rt?rt.fbo:null);
  gl.viewport(0,0,rt?rt.w:cv.width,rt?rt.h:cv.height);
}

function render(){
  const steps=Math.round(clamp(30*P.quality+14,20,72));

  /* ── scene ─────────────────────────────────────────────── */
  bindRT(sceneRT);
  gl.disable(gl.BLEND);
  gl.useProgram(bgProg);
  gl.uniform2f(bgProg.u.uRes,RW,RH);
  gl.uniform1f(bgProg.u.uTime,Fluid.t);
  gl.uniform1f(bgProg.u.uShafts,P.shafts);
  gl.uniform2f(bgProg.u.uLightDir2,LDIR2.x,LDIR2.y);
  drawQuad();

  // far to near, so alpha compositing is correct
  // stable tiebreak stops coincident depths flickering order
  jellies.sort((a,b)=> (b.camZ-a.camZ) || (a.id-b.id));

  // rebuild tentacle geometry, grouped far-set / near-set per animal
  vcount=0;
  const ranges=[];
  for(const j of jellies){
    const c=j.col;
    const back0=vcount;
    for(const t of j.tentacles) if(!t.near) emitFilament(t.f,TG[t.cls],c,j,Fluid.t);
    const back1=vcount;
    for(const t of j.tentacles) if(t.near) emitFilament(t.f,TG[t.cls],c,j,Fluid.t);
    ranges.push([back0,back1,vcount]);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,lineVBO);
  gl.bufferData(gl.ARRAY_BUFFER,vbuf.subarray(0,vcount*STRIDE),gl.DYNAMIC_DRAW);

  gl.enable(gl.BLEND);
  const sc=RW/W;   // render target may differ from CSS pixels

  for(let i=0;i<jellies.length;i++){
    const j=jellies[i], r=ranges[i];

    // far tentacles (additive, dimmed as if seen through gel)
    if(r[1]>r[0]){
      gl.blendFunc(gl.ONE,gl.ONE);
      gl.useProgram(lineProg);
      gl.uniform2f(lineProg.u.uRes,W,H);
      gl.bindVertexArray(lineVAO);
      gl.drawArrays(gl.TRIANGLES,r[0],r[1]-r[0]);
    }

    // the volume itself (premultiplied over)
    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(bellProg);
    const u=bellProg.u;
    gl.uniform2f(u.uRes,RW,RH);
    gl.uniform1f(u.uFocal,CAM.F*sc);
    gl.uniform2f(u.uCenterPx,j.sx*sc,j.sy*sc);
    gl.uniform1f(u.uRadPx,j.radPx*sc*1.15);
    gl.uniform3f(u.uCenter,j.wx,j.wy,j.camZ);
    gl.uniformMatrix3fv(u.uRot,false,j.mat);
    const breath=j.breathAt(0)*P.pulseDepth;
    gl.uniform1f(u.uR,j.R*(1-breath*0.07));
    gl.uniform1f(u.uH,j.Hh*(1+breath*0.05));
    gl.uniform1f(u.uThick,j.thick);
    gl.uniform1f(u.uBound,j.bound);
    gl.uniform3f(u.uColor,j.col[0],j.col[1],j.col[2]);
    gl.uniform1f(u.uLapK,j.lapK);
    gl.uniform1f(u.uLapA,j.lapA);
    gl.uniform1f(u.uLapPh,j.lapPh);
    gl.uniform1f(u.uSeed,j.seed);
    gl.uniform1f(u.uCanalN,j.canalN);
    gl.uniform1f(u.uCanalAmp,j.canalAmp);
    gl.uniform1f(u.uGonad,j.gonad);
    gl.uniform1f(u.uArm,j.arm);
    gl.uniform3f(u.uColor2,j.col2[0],j.col2[1],j.col2[2]);
    gl.uniform1f(u.uSoft,clamp((j.z-CAM.near)/(CAM.far-CAM.near),0,1)*0.55);
    gl.uniform3f(u.uLight,LIGHT.x,LIGHT.y,LIGHT.z);
    gl.uniform1f(u.uDensity,P.density);
    gl.uniform1f(u.uScatter,P.scatter);
    gl.uniform1f(u.uTissue,P.tissue);
    gl.uniform1f(u.uEmissive,P.emissive);
    gl.uniform1f(u.uTime,Fluid.t);
    gl.uniform1f(u.uFade,Math.exp(-(j.z-CAM.near)/1500));
    gl.uniform1i(u.uSteps,steps);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES,0,3);

    // near tentacles, over the bell
    if(r[2]>r[1]){
      gl.blendFunc(gl.ONE,gl.ONE);
      gl.useProgram(lineProg);
      gl.uniform2f(lineProg.u.uRes,W,H);
      gl.bindVertexArray(lineVAO);
      gl.drawArrays(gl.TRIANGLES,r[1],r[2]-r[1]);
    }
  }

  /* ── exposure accumulation (motion blur) ───────────────── */
  const a=clamp(P.shutter,0.1,1);
  bindRT(accumRT);
  gl.disable(gl.BLEND);
  gl.useProgram(mixProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneRT.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,prevRT.tex);
  gl.uniform1i(mixProg.u.uA,0);
  gl.uniform1i(mixProg.u.uB,1);
  gl.uniform1f(mixProg.u.uMix,a);
  drawQuad();
  // accum becomes the history for next frame
  const t=prevRT; prevRT=accumRT; accumRT=t;
  const shown=prevRT;

  /* ── bloom ─────────────────────────────────────────────── */
  bindRT(brightRT);
  gl.useProgram(brightProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,shown.tex);
  gl.uniform1i(brightProg.u.uTex,0);
  gl.uniform1f(brightProg.u.uThresh,0.16);
  drawQuad();

  for(let i=0;i<2;i++){
    bindRT(blurRT);
    gl.useProgram(blurProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,brightRT.tex);
    gl.uniform1i(blurProg.u.uTex,0);
    gl.uniform2f(blurProg.u.uDir,1.0/brightRT.w,0);
    drawQuad();
    bindRT(brightRT);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,blurRT.tex);
    gl.uniform2f(blurProg.u.uDir,0,1.0/blurRT.h);
    drawQuad();
  }

  /* ── composite ─────────────────────────────────────────── */
  bindRT(null);
  gl.useProgram(compProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,shown.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,brightRT.tex);
  gl.uniform1i(compProg.u.uScene,0);
  gl.uniform1i(compProg.u.uBloom,1);
  gl.uniform2f(compProg.u.uRes,cv.width,cv.height);
  gl.uniform1f(compProg.u.uBloomAmt,0.85*P.bloom);
  gl.uniform1f(compProg.u.uGrain,P.grain);
  gl.uniform1f(compProg.u.uTime,Fluid.t);
  drawQuad();
}

/* temporal mix program (declared after use above is fine —
   function bodies run later) */
const mixProg=prog(VS_QUAD,`#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform sampler2D uA, uB;
uniform float uMix;
void main(){
  vec3 cur=texture(uA,vUV).rgb;
  vec3 hist=texture(uB,vUV).rgb;
  frag=vec4(mix(hist,cur,uMix),1.0);
}`,'mix');

/* ═══════════════════════════════════════════════════════════
   LOOP — 120 Hz physics, decoupled from display rate
   ═══════════════════════════════════════════════════════════ */
const STEP=1/120;
let acc=0,last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  let guard=0;
  while(acc>=STEP && guard++<8){
    Fluid.t+=STEP;
    for(const j of jellies) j.step(STEP);
    acc-=STEP;
  }
  /* Contact is resolved once per rendered frame rather than
     per physics step: it is a positional correction, not a
     force, so it does not need 120 Hz and this halves its
     cost outright. */
  Tangle.run(jellies,P.tangle);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
